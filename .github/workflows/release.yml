name: Build and Release Kombajn

# Uruchom akcję TYLKO wtedy, gdy wyślesz na GitHuba tag zaczynający się od "v" (np. v1.0.5)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v4

    - name: Instalacja środowiska Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacja bibliotek z requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Kompilacja kodu do pliku .exe
      run: |
        pyinstaller --onefile --windowed --name "KombajnLesnyPRO" guipia.py

    - name: Publikacja wydania na GitHubie
      uses: softprops/action-gh-release@v2
      with:
        files: dist/KombajnLesnyPRO.exe
        generate_release_notes: true
